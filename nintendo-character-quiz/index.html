<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>닌텐도 캐릭터 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #E60012 0%, #FF6B6B 50%, #4ECDC4 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: #fff;
            padding: 40px 0;
        }
        
        h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,.5);
        }
        
        .subtitle {
            font-size: 1.3em;
            opacity: 0.95;
        }
        
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
            margin-bottom: 30px;
        }
        
        .intro-screen, .question-screen, .result-screen {
            display: none;
        }
        
        .intro-screen.active, .question-screen.active, .result-screen.active {
            display: block;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #E60012, #FF6B6B);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .question-text {
            font-size: 1.3em;
            color: #222;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .option {
            padding: 20px;
            background: #f8f9fa;
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
        }
        
        .option:hover {
            transform: translateX(5px);
        }
        
        .option.selected {
            color: #fff;
            background: #E60012;
            border-color: #E60012;
            transform: translateX(5px);
        }
        
        button.primary {
            width: 100%;
            padding: 18px;
            font-size: 1.3em;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #E60012, #FF6B6B);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        button.primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,.3);
        }
        
        .result-icon {
            font-size: 8em;
            text-align: center;
            margin: 20px 0;
        }
        
        .result-title {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            color: #E60012;
        }
        
        .description {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            margin: 30px 0;
            border-left: 5px solid #E60012;
        }
        
        .description h4 {
            color: #E60012;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .description p {
            line-height: 1.8;
            color: #555;
            font-size: 1.05em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 닌텐도 캐릭터 테스트</h1>
            <p class="subtitle">나와 닮은 닌텐도 캐릭터는?</p>
        </header>
        
        <div class="card intro-screen active">
            <div style="text-align: center">
                <h2 style="margin-bottom: 30px; color: #333">🎮 나는 누구일까?</h2>
                <p style="font-size: 1.2em; line-height: 1.8; color: #555; margin-bottom: 15px">
                    마리오, 젤다, 커비, 링크...<br>
                    어떤 캐릭터와 닮았을까요?
                </p>
                <button class="primary" onclick="startTest()">테스트 시작</button>
            </div>
        </div>
        
        <div class="card question-screen">
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <div class="question-content">
                <div style="color: #E60012; font-size: 1.1em; margin-bottom: 20px" id="questionNumber">질문 1/10</div>
                <div class="question-text" id="questionText"></div>
                <div class="options" id="options"></div>
                <button class="primary" id="nextButton" onclick="nextQuestion()" disabled>다음</button>
            </div>
        </div>
        
        <div class="card result-screen">
            <div class="result-icon" id="resultIcon">🍄</div>
            <div class="result-title" id="resultTitle">마리오</div>
            <div class="description" id="resultDescription"></div>
            <button class="primary" style="background: #6c757d" onclick="retryTest()">다시 하기</button>
        </div>
    </div>
    
    <script src="quiz.js"></script>
</body>
</html>
