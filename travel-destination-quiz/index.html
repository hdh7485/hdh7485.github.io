<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나에게 맞는 여행지는? 🌍✈️</title>
    <meta name="description" content="12개 질문으로 알아보는 당신에게 딱 맞는 여행지! 도쿄, 파리, 발리, 뉴욕 등 맞춤 추천">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            padding: 40px 0;
        }

        h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 1.3em;
            opacity: 0.95;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            margin-bottom: 30px;
        }

        .question-num {
            color: #667eea;
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.6em;
            margin-bottom: 30px;
            color: #333;
            line-height: 1.4;
        }

        .options {
            display: grid;
            gap: 15px;
        }

        .option-btn {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: 3px solid transparent;
            padding: 25px;
            border-radius: 15px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            color: #333;
        }

        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: white;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .result-card {
            text-align: center;
        }

        .result-emoji {
            font-size: 6em;
            margin: 20px 0;
        }

        .result-title {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .result-desc {
            font-size: 1.3em;
            line-height: 1.8;
            color: #555;
            margin-bottom: 30px;
        }

        .result-features {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin: 25px 0;
            text-align: left;
        }

        .result-features h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.4em;
        }

        .result-features ul {
            list-style: none;
            padding-left: 0;
        }

        .result-features li {
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 1.1em;
        }

        .result-features li:last-child {
            border-bottom: none;
        }

        .result-features li::before {
            content: "✈️ ";
            margin-right: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .question-text {
                font-size: 1.3em;
            }
            
            .option-btn {
                padding: 20px;
                font-size: 1.1em;
            }

            .result-title {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 여행지 추천 테스트 ✈️</h1>
            <p class="subtitle">12개 질문으로 알아보는 나에게 딱 맞는 여행지!</p>
        </header>

        <div id="quiz-container" class="card">
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <div class="question-num" id="question-num"></div>
            <div class="question-text" id="question-text"></div>
            <div class="options" id="options"></div>
        </div>

        <div id="result-container" class="card hidden">
            <div class="result-card">
                <div class="result-emoji" id="result-emoji"></div>
                <h2 class="result-title" id="result-title"></h2>
                <p class="result-desc" id="result-desc"></p>
                <div class="result-features">
                    <h3>🎯 이 여행지의 매력</h3>
                    <ul id="result-features"></ul>
                </div>
                <div class="result-features">
                    <h3>💡 추천 활동</h3>
                    <ul id="result-activities"></ul>
                </div>
                <button class="btn" onclick="restartQuiz()">🔄 다시 테스트하기</button>
                <button class="btn" onclick="shareResult()">📤 결과 공유하기</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "휴가 때 가장 먼저 떠오르는 활동은?",
                options: [
                    { text: "맛집 탐방과 쇼핑", type: "tokyo" },
                    { text: "박물관, 미술관 관람", type: "paris" },
                    { text: "해변에서 휴식", type: "bali" },
                    { text: "도시 야경 구경", type: "newyork" }
                ]
            },
            {
                question: "여행 스타일은?",
                options: [
                    { text: "계획적이고 알차게", type: "tokyo" },
                    { text: "여유롭고 느긋하게", type: "bali" },
                    { text: "트렌디하고 활동적으로", type: "newyork" },
                    { text: "낭만적이고 감성적으로", type: "paris" }
                ]
            },
            {
                question: "선호하는 숙소 위치는?",
                options: [
                    { text: "대중교통이 편리한 도심", type: "tokyo" },
                    { text: "조용한 해변가", type: "bali" },
                    { text: "번화가 한복판", type: "newyork" },
                    { text: "역사적인 구시가지", type: "paris" }
                ]
            },
            {
                question: "여행 중 가장 중요한 것은?",
                options: [
                    { text: "맛있는 음식", type: "tokyo" },
                    { text: "힐링과 휴식", type: "bali" },
                    { text: "다양한 경험", type: "newyork" },
                    { text: "문화와 예술", type: "paris" }
                ]
            },
            {
                question: "여행지에서 하고 싶은 것은?",
                options: [
                    { text: "현지 길거리 음식 먹기", type: "bangkok" },
                    { text: "유명 명소 사진 찍기", type: "paris" },
                    { text: "스파와 마사지", type: "bali" },
                    { text: "공연 관람", type: "newyork" }
                ]
            },
            {
                question: "선호하는 날씨는?",
                options: [
                    { text: "선선하고 쾌적한 날씨", type: "tokyo" },
                    { text: "따뜻하고 햇살 좋은 날씨", type: "bali" },
                    { text: "사계절이 뚜렷한 날씨", type: "paris" },
                    { text: "날씨는 별로 상관없어요", type: "newyork" }
                ]
            },
            {
                question: "여행 예산은?",
                options: [
                    { text: "합리적인 가격대", type: "bangkok" },
                    { text: "중간 정도", type: "tokyo" },
                    { text: "좀 비싸도 괜찮아요", type: "paris" },
                    { text: "럭셔리하게", type: "dubai" }
                ]
            },
            {
                question: "여행지에서 먹고 싶은 음식은?",
                options: [
                    { text: "신선한 해산물", type: "bali" },
                    { text: "정통 프렌치 요리", type: "paris" },
                    { text: "다양한 세계 음식", type: "newyork" },
                    { text: "길거리 음식", type: "bangkok" }
                ]
            },
            {
                question: "선호하는 이동 수단은?",
                options: [
                    { text: "지하철/전철", type: "tokyo" },
                    { text: "택시/우버", type: "dubai" },
                    { text: "걸어서 산책", type: "paris" },
                    { text: "오토바이/툭툭", type: "bangkok" }
                ]
            },
            {
                question: "여행 중 사진은?",
                options: [
                    { text: "인생샷 필수!", type: "paris" },
                    { text: "추억용으로 적당히", type: "bali" },
                    { text: "SNS 업로드용으로 많이", type: "newyork" },
                    { text: "거의 안 찍어요", type: "tokyo" }
                ]
            },
            {
                question: "여행에서 피하고 싶은 것은?",
                options: [
                    { text: "너무 덥거나 추운 날씨", type: "tokyo" },
                    { text: "복잡하고 시끄러운 곳", type: "bali" },
                    { text: "언어 소통 문제", type: "newyork" },
                    { text: "지루한 일정", type: "bangkok" }
                ]
            },
            {
                question: "여행 후 가장 기억에 남는 것은?",
                options: [
                    { text: "현지인과의 교류", type: "bangkok" },
                    { text: "멋진 풍경과 사진", type: "bali" },
                    { text: "맛있었던 음식", type: "tokyo" },
                    { text: "특별한 경험", type: "newyork" }
                ]
            }
        ];

        const results = {
            tokyo: {
                emoji: "🗼",
                title: "일본 도쿄",
                description: "현대와 전통이 공존하는 매력적인 도시! 깔끔한 시스템, 맛있는 음식, 쇼핑의 천국. 계획적이고 알찬 여행을 원하는 당신에게 딱입니다.",
                features: [
                    "편리한 대중교통과 깨끗한 거리",
                    "다양한 미식 경험 (라멘, 스시, 이자카야)",
                    "현대적인 쇼핑몰과 전통 시장",
                    "체계적이고 안전한 여행 환경"
                ],
                activities: [
                    "시부야, 하라주쿠에서 쇼핑",
                    "아사쿠사 센소지 사원 방문",
                    "츠키지 시장에서 초밥 먹기",
                    "도쿄타워/스카이트리 야경 감상"
                ]
            },
            paris: {
                emoji: "🗼",
                title: "프랑스 파리",
                description: "낭만과 예술의 도시! 아름다운 건축물, 세계적인 박물관, 프렌치 요리. 감성적이고 우아한 여행을 원하는 당신에게 완벽합니다.",
                features: [
                    "에펠탑, 루브르 등 세계적인 명소",
                    "정통 프렌치 요리와 카페 문화",
                    "센강변 산책로와 낭만적인 분위기",
                    "풍부한 역사와 예술 작품"
                ],
                activities: [
                    "루브르 박물관에서 명화 감상",
                    "몽마르트 언덕 산책",
                    "센강 유람선 타기",
                    "카페에서 와인과 크루아상 즐기기"
                ]
            },
            bali: {
                emoji: "🏝️",
                title: "인도네시아 발리",
                description: "천국 같은 휴양지! 아름다운 해변, 신선한 열대 과일, 전통 스파. 여유롭고 평화로운 힐링을 원하는 당신에게 최고입니다.",
                features: [
                    "에메랄드빛 바다와 하얀 모래사장",
                    "전통 발리니즈 스파와 요가",
                    "저렴한 물가와 친절한 사람들",
                    "이국적인 힌두 사원과 문화"
                ],
                activities: [
                    "우붓에서 요가와 명상",
                    "스미냑 해변에서 서핑",
                    "테갈랄랑 계단식 논 구경",
                    "전통 마사지와 스파 체험"
                ]
            },
            newyork: {
                emoji: "🗽",
                title: "미국 뉴욕",
                description: "세계의 중심, 뉴욕! 24시간 살아있는 도시, 다양한 문화, 브로드웨이 공연. 역동적이고 트렌디한 여행을 원하는 당신에게 딱입니다.",
                features: [
                    "자유의 여신상, 타임스퀘어 등 랜드마크",
                    "브로드웨이 뮤지컬과 공연",
                    "세계 각국의 음식 맛볼 수 있는 도시",
                    "24시간 깨어있는 활기찬 분위기"
                ],
                activities: [
                    "브로드웨이 뮤지컬 관람",
                    "센트럴파크 산책",
                    "브루클린 브릿지 걷기",
                    "5번가에서 쇼핑"
                ]
            },
            bangkok: {
                emoji: "🛕",
                title: "태국 방콕",
                description: "활기찬 동남아시아의 중심! 저렴한 물가, 맛있는 길거리 음식, 화려한 사원. 가성비 좋고 다이내믹한 여행을 원하는 당신에게 추천합니다.",
                features: [
                    "저렴한 물가와 합리적인 여행 비용",
                    "세계적으로 유명한 태국 음식",
                    "황금빛 찬란한 사원들",
                    "활기찬 야시장과 나이트라이프"
                ],
                activities: [
                    "왓포 사원에서 와불 보기",
                    "카오산로드 야시장 구경",
                    "차오프라야강 보트 타기",
                    "팟타이와 망고 스티키 라이스 먹기"
                ]
            },
            dubai: {
                emoji: "🏙️",
                title: "UAE 두바이",
                description: "사막 위의 기적! 초고층 빌딩, 럭셔리 쇼핑몰, 미래적인 도시. 화려하고 럭셔리한 여행을 원하는 당신에게 완벽합니다.",
                features: [
                    "세계에서 가장 높은 빌딩 부르즈 칼리파",
                    "럭셔리 쇼핑몰과 황금 시장",
                    "사막 사파리와 낙타 체험",
                    "최첨단 시설과 서비스"
                ],
                activities: [
                    "부르즈 칼리파 전망대 오르기",
                    "두바이 몰에서 쇼핑",
                    "사막 사파리 투어",
                    "팜 주메이라에서 럭셔리 리조트 체험"
                ]
            }
        };

        let currentQuestion = 0;
        let scores = {
            tokyo: 0,
            paris: 0,
            bali: 0,
            newyork: 0,
            bangkok: 0,
            dubai: 0
        };

        function showQuestion() {
            const question = questions[currentQuestion];
            document.getElementById('question-num').textContent = `질문 ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('question-text').textContent = question.question;
            
            const optionsContainer = document.getElementById('options');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = option.text;
                button.onclick = () => selectOption(option.type);
                optionsContainer.appendChild(button);
            });

            updateProgress();
        }

        function selectOption(type) {
            scores[type]++;
            currentQuestion++;

            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function updateProgress() {
            const progress = (currentQuestion / questions.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
        }

        function showResult() {
            let maxScore = 0;
            let resultType = 'tokyo';

            for (let type in scores) {
                if (scores[type] > maxScore) {
                    maxScore = scores[type];
                    resultType = type;
                }
            }

            const result = results[resultType];

            document.getElementById('result-emoji').textContent = result.emoji;
            document.getElementById('result-title').textContent = result.title;
            document.getElementById('result-desc').textContent = result.description;

            const featuresContainer = document.getElementById('result-features');
            featuresContainer.innerHTML = '';
            result.features.forEach(feature => {
                const li = document.createElement('li');
                li.textContent = feature;
                featuresContainer.appendChild(li);
            });

            const activitiesContainer = document.getElementById('result-activities');
            activitiesContainer.innerHTML = '';
            result.activities.forEach(activity => {
                const li = document.createElement('li');
                li.textContent = activity;
                activitiesContainer.appendChild(li);
            });

            document.getElementById('quiz-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');
        }

        function restartQuiz() {
            currentQuestion = 0;
            scores = {
                tokyo: 0,
                paris: 0,
                bali: 0,
                newyork: 0,
                bangkok: 0,
                dubai: 0
            };
            
            document.getElementById('quiz-container').classList.remove('hidden');
            document.getElementById('result-container').classList.add('hidden');
            
            showQuestion();
        }

        function shareResult() {
            const resultTitle = document.getElementById('result-title').textContent;
            const text = `나에게 맞는 여행지는 ${resultTitle}! 🌍✈️\n\n당신도 테스트해보세요!`;
            
            if (navigator.share) {
                navigator.share({
                    title: '여행지 추천 테스트',
                    text: text,
                    url: window.location.href
                }).catch(err => console.log('공유 실패:', err));
            } else {
                alert('공유 기능을 지원하지 않는 브라우저입니다.');
            }
        }

        // 시작
        showQuestion();
    </script>
</body>
</html>
