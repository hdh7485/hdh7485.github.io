<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>2025 밈 퀴즈</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Malgun Gothic',sans-serif;background:linear-gradient(135deg,#ff6b6b 0%,#feca57 100%);min-height:100vh;padding:20px}.container{max-width:900px;margin:0 auto}header{text-align:center;color:#fff;padding:40px 0}h1{font-size:2.8em;margin-bottom:10px;text-shadow:2px 2px 4px rgba(0,0,0,.5)}.subtitle{font-size:1.3em;opacity:.95}.card{background:#fff;border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.4);margin-bottom:30px}.intro-screen,.question-screen,.result-screen{display:none}.intro-screen.active,.question-screen.active,.result-screen.active{display:block}.question-text{font-size:1.3em;color:#222;margin-bottom:30px;line-height:1.6}.options{display:flex;flex-direction:column;gap:15px}.option{padding:20px;background:#f8f9fa;border:3px solid #e0e0e0;border-radius:12px;cursor:pointer;transition:all .3s;font-size:1.1em}.option:hover{transform:translateX(5px)}.option.selected{color:#fff;background:#ff6b6b;border-color:#ff6b6b;transform:translateX(5px)}.option.correct{background:#48c774;border-color:#48c774;color:#fff}.option.wrong{background:#f14668;border-color:#f14668;color:#fff}button.primary{width:100%;padding:18px;font-size:1.3em;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff6b6b,#feca57);border:none;border-radius:12px;cursor:pointer;transition:all .3s;margin-top:20px}button.primary:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(0,0,0,.3)}.result-icon{font-size:8em;text-align:center;margin:20px 0}.result-title{font-size:2.5em;font-weight:700;margin-bottom:10px;text-align:center;color:#ff6b6b}.description{background:#f8f9fa;padding:25px;border-radius:12px;margin:30px 0;border-left:5px solid #ff6b6b}.description h4{color:#ff6b6b;margin-bottom:15px;font-size:1.3em}.description p{line-height:1.8;color:#555;font-size:1.05em}.score{font-size:3em;color:#ff6b6b;font-weight:700;text-align:center;margin:20px 0}</style></head><body><div class="container"><header><h1>🔥 2025 밈 퀴즈</h1><p class="subtitle">올해 밈, 얼마나 아시나요?</p></header><div class="card intro-screen active"><div style="text-align:center"><h2 style="margin-bottom:30px;color:#333">😂 밈 고수 테스트!</h2><p style="font-size:1.2em;line-height:1.8;color:#555;margin-bottom:15px">2025년 가장 핫한 밈들!<br>몇 개나 맞힐 수 있을까요?</p><button class="primary" onclick="startTest()">도전하기</button></div></div><div class="card question-screen"><div style="color:#ff6b6b;font-size:1.1em;margin-bottom:20px" id="questionNumber">문제 1/10</div><div class="question-text" id="questionText"></div><div class="options" id="options"></div><button class="primary" id="nextButton" onclick="nextQuestion()" style="display:none">다음 문제</button></div><div class="card result-screen"><div class="result-icon" id="resultIcon">🏆</div><div class="score" id="score">10/10</div><div class="result-title">밈 고수!</div><div class="description" id="resultDescription"></div><button class="primary" style="background:#6c757d" onclick="retryTest()">다시 도전</button></div></div><script src="quiz.js"></script></body></html>
