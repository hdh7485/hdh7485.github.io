<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>점심 메뉴 룰렛 🍽️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.3em;
            opacity: 0.95;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .roulette-container {
            margin: 40px 0;
            position: relative;
        }

        .result-display {
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .menu-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .menu-name {
            font-size: 3em;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .menu-category {
            font-size: 1.3em;
            color: rgba(255, 255, 255, 0.9);
        }

        .placeholder {
            font-size: 2em;
            color: rgba(255, 255, 255, 0.7);
        }

        .spinning {
            animation: spin 0.1s linear infinite;
        }

        @keyframes spin {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        button.primary {
            width: 100%;
            padding: 25px;
            font-size: 1.5em;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 30px;
        }

        button.primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button.primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .info-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
        }

        .info-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .menu-tag {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.9em;
            color: #555;
            border: 1px solid #e0e0e0;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .card {
                padding: 30px;
            }
            
            .menu-icon {
                font-size: 3em;
            }
            
            .menu-name {
                font-size: 2em;
            }
            
            .menu-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍽️ 점심 메뉴 룰렛</h1>
            <p class="subtitle">오늘 뭐 먹지? 고민 끝!</p>
        </header>

        <div class="card">
            <div class="roulette-container">
                <div class="result-display" id="resultDisplay">
                    <div class="placeholder">🎲 버튼을 눌러보세요!</div>
                </div>
            </div>

            <button class="primary" id="spinButton" onclick="spinRoulette()">
                🎰 메뉴 뽑기!
            </button>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number">50</div>
                    <div class="stat-label">메뉴 개수</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="spinCount">0</div>
                    <div class="stat-label">오늘 뽑은 횟수</div>
                </div>
            </div>

            <div class="info-section">
                <h3>📋 전체 메뉴 목록</h3>
                <div class="menu-grid" id="menuGrid">
                    <!-- 메뉴들이 여기 추가됨 -->
                </div>
            </div>
        </div>
    </div>

    <script src="roulette.js"></script>
</body>
</html>
